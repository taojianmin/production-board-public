plugins { id 'com.android.application' }

android {
    namespace 'com.scjd.board'
    compileSdk 36
    defaultConfig {
        applicationId 'com.scjd.board'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
