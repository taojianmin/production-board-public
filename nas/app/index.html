  const tk = e.target.closest?.('.tk[data-task]');
  if (!tk || e.button > 0 || e.target.closest('button,input,select,a')) return;
  const touch = e.pointerType !== 'mouse';
  PD = { tid:tk.dataset.task, el:tk, x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, touch, started:false };
  if (touch) PD.timer = setTimeout(() => { if (PD && !PD.started) { pdStart(PD.lx, PD.ly); try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} requestAnimationFrame(pdLoop); } }, 400);
});
document.addEventListener('pointermove', e => {
  if (!PD) return;
  if (!PD.started) {
    const d = Math.hypot(e.clientX - PD.x, e.clientY - PD.y);
    PD.lx = e.clientX; PD.ly = e.clientY;
    if (PD.touch) { if (d > 10) { clearTimeout(PD.timer); PD = null; } return; }
    if (d > 5) { pdStart(e.clientX, e.clientY); requestAnimationFrame(pdLoop); }
    return;
  }
  e.preventDefault();
  pdMove(e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => pdEnd(true));
document.addEventListener('pointercancel', () => pdEnd(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') pdEnd(false); });
document.addEventListener('touchmove', e => { if (PD && PD.started) e.preventDefault(); }, { passive:false });
document.addEventListener('contextmenu', e => { if (PD && PD.touch) e.preventDefault(); });
document.addEventListener('click', e => { if (S.justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);

/* 拖动排序（鼠标和触屏通用）：
   - 工序行和设置页工人行：按住左边把手直接拖（data-list = 订单 id / new / cfg / cfgw）
   - 任务墙的工人列：按住名字拖；手机上按住约半秒再拖 */
let LD = null, LDscroll = 0;
function ldItems(){ return LD.kind === 'col' ? [...document.querySelectorAll('.col[data-worker]')] : [...document.querySelectorAll(`.prow-d[data-list="${LD.list}"]`)]; }
function ldId(el){ return LD.kind === 'col' ? el.dataset.worker : el.dataset.p; }
function ldClear(){ document.querySelectorAll('.prow-d.before,.prow-d.after,.col.colbefore,.col.colafter').forEach(x => x.classList.remove('before', 'after', 'colbefore', 'colafter')); }
function ldStart(x, y){
  const r = LD.el.getBoundingClientRect(), g = LD.el.cloneNode(true);
  g.classList.add('ghost', 'ghost-row'); g.style.width = r.width + 'px';
  LD.dx = x - r.left; LD.dy = y - r.top;
  document.body.appendChild(g);
  LD.ghost = g; LD.started = true;
  LD.el.classList.add('dragging'); document.body.classList.add('pdragging');
  ldMove(x, y); requestAnimationFrame(ldLoop);
}
function ldMove(x, y){
  LD.lx = x; LD.ly = y;
  LD.ghost.style.transform = `translate(${x - LD.dx}px,${y - LD.dy}px)`;
  ldClear(); LD.target = null;
  LDscroll = y < 70 ? -12 : y > innerHeight - 70 ? 12 : 0;
  const items = ldItems().filter(el => ldId(el) !== LD.id); if (!items.length) return;
  let best = null, after = false;
  if (LD.kind === 'col') {
    let bd = Infinity;
    for (const el of items) {
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = Math.abs(y - cy);
      if (d < bd) { bd = d; best = el; after = y > cy; }
    }
    best.classList.add(after ? 'colafter' : 'colbefore');
  } else {
    for (const el of items) { const r = el.getBoundingClientRect(); if (y < r.top + r.height / 2) { best = el; break; } }
    if (!best) { best = items[items.length - 1]; after = true; }
    best.classList.add(after ? 'after' : 'before');
  }
  LD.target = { id:ldId(best), after };
}
function ldLoop(){
  if (!LD || !LD.started) return;
  if (LDscroll) { scrollBy(0, LDscroll); ldMove(LD.lx, LD.ly); }
  requestAnimationFrame(ldLoop);
}
function ldEnd(drop){
  if (!LD) return;
  clearTimeout(LD.timer);
  const d = LD; LD = null; LDscroll = 0;
  if (!d.started) return;
  d.ghost.remove(); ldClear();
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.body.classList.remove('pdragging');
  S.justDragged = true; setTimeout(() => { S.justDragged = false; }, 50);
  if (drop && d.target) applyOrder(d.kind, d.list, d.id, d.target);
}
function reorderIds(ids, id, tid, after){ const a = ids.filter(x => x !== id); let i = a.indexOf(tid); if (i < 0) i = a.length; else if (after) i++; a.splice(i, 0, id); return a; }
function applyOrder(kind, list, id, t){
  if (kind === 'col') {
    const ws = workers(), ids = reorderIds(ws.map(w => w.id), id, t.id, t.after);
    if (S.cfgDraft) S.cfgDraft.workers.sort((a, b) => { const i = ids.indexOf(a.id), j = ids.indexOf(b.id); return (i < 0 ? 999 : i) - (j < 0 ? 999 : j); });
    save(db => db.doc('config/main').update({ workers:ids.map(x => ws.find(w => w.id === x)) }), '工人顺序已调整');
    return;
  }
  if (list === 'cfg' || list === 'cfgw') {
    const c = S.cfgDraft; if (!c) return;
    const key = list === 'cfg' ? 'processes' : 'workers';
    const ids = reorderIds(c[key].map(x => x.id), id, t.id, t.after);
    c[key] = ids.map(x => c[key].find(y => y.id === x));
    render(); toast('顺序已调整，点「保存设置」后生效');
    return;
  }
  if (list === 'sty') {
    const d = S.styleDraft; if (!d) return;
    const ids = reorderIds(d.steps.map(x => x.id), id, t.id, t.after);
    d.steps = ids.map(x => d.steps.find(y => y.id === x)); render();
    return;
  }
  if (list === 'new') {
    const ids = reorderIds(S.newSteps.map(s => s.id), id, t.id, t.after);
    S.newSteps = ids.map(x => S.newSteps.find(s => s.id === x)); render();
    return;
  }
  const o = S.orders[list]; if (!o) return;
  const st = stepsOf(o), ids = reorderIds(st.map(s => s.id), id, t.id, t.after);
  writeSteps(o, ids.map(x => st.find(s => s.id === x)));
}
document.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const grip = e.target.closest?.('.grip');
  const head = !grip && e.target.closest?.('.col[data-worker] > .ch');
  if (!grip && !head) return;
  if (e.target.closest('button,input,select,a')) return;
  let el, kind, list;
  if (grip && grip.closest('.prow-d')) { el = grip.closest('.prow-d'); kind = 'row'; list = el.dataset.list; }
  else { el = (grip || head).closest('.col[data-worker]'); if (!el) return; kind = 'col'; }
  const touch = e.pointerType !== 'mouse';
  LD = { kind, list, el, id: kind === 'col' ? el.dataset.worker : el.dataset.p, x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, touch, started:false, handle:!!grip };
  if (grip) e.preventDefault();
  if (touch && !grip) LD.timer = setTimeout(() => { if (LD && !LD.started) { ldStart(LD.lx, LD.ly); try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} } }, 400);
});
document.addEventListener('pointermove', e => {
  if (!LD) return;
  if (!LD.started) {
    const d = Math.hypot(e.clientX - LD.x, e.clientY - LD.y);
    LD.lx = e.clientX; LD.ly = e.clientY;
    if (LD.touch && !LD.handle) { if (d > 10) { clearTimeout(LD.timer); LD = null; } return; }
    if (d > 4) ldStart(e.clientX, e.clientY);
    return;
  }
  e.preventDefault();
  ldMove(e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => ldEnd(true));
document.addEventListener('pointercancel', () => ldEnd(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') ldEnd(false); });
document.addEventListener('touchmove', e => { if (LD && (LD.started || LD.handle)) e.preventDefault(); }, { passive:false });

/* ---------- 连接数据 ---------- */
(async () => {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { S.offline = true; render(); return; }
  S.db = db;
  const fail = e => { if (e?.code !== 'unavailable') toast('数据连接中断，请刷新页面', true); };
  db.doc('config/main').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; S.got.cfg = true; render(); }, fail);
  db.collection('orders').onSnapshot(q => { const m = {}; q.docs.forEach(d => { m[d.id] = { ...d.data(), id:d.id }; }); S.orders = m; S.got.orders = true; render(); }, fail);
  db.collection('tasks').onSnapshot(q => { const m = {}; q.docs.forEach(d => { m[d.id] = { ...d.data(), id:d.id }; }); S.tasks = m; S.got.tasks = true; render(); }, fail);
  db.doc('logs/' + TODAY).onSnapshot(s => { S.log = s.exists ? s.data() : { entries:{} }; render(); }, fail);
})();
render();
})();
</script>
