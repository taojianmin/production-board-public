<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<script>
// 让看板页面把数据存到 NAS：提供和 claude.ai 一样的 claude.use('db') 接口，背后调用 NAS 服务端
(function () {
  let docs = {}, rev = -1, loaded = false;
  const subs = new Set();
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const o = { ...a }; for (const k of Object.keys(b)) o[k] = isObj(b[k]) && isObj(a[k]) ? merge(a[k], b[k]) : b[k]; return o; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const segs = p => p.split('/').length;

  // 断线提示
  const badge = document.createElement('div');
  badge.textContent = '和 NAS 断开连接，正在重连…（这段时间的修改可能保存不上）';
  badge.style.cssText = 'position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:#b3261e;color:#fff;padding:6px 14px;border-radius:6px;font:500 13px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)';
  badge.hidden = true;
  const showBadge = on => { badge.hidden = !on; if (on && !badge.isConnected) document.body.appendChild(badge); };

  // 外网访问要登录：登录过期时跳到登录页
  const toLogin = () => { location.replace('login?next=' + encodeURIComponent(location.pathname + location.search)); };

  function notify() { subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }

  async function poll() {
    for (;;) {
      try {
        const r = await fetch('api/state?rev=' + rev, { cache: 'no-store' });
        if (r.status === 401) return toLogin();
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        showBadge(false);
        if (!j.same) { docs = j.docs || {}; rev = j.rev; loaded = true; notify(); }
      } catch (e) {
        showBadge(true);
        await sleep(3000);
      }
    }
  }

  const snapDoc = p => {
    const d = docs[p];
    return { id: p.split('/').pop(), exists: d !== undefined, data: () => clone(d), metadata: { fromCache: false, hasPendingWrites: false } };
  };
  const snapCol = c => {
    const n = segs(c) + 1;
    const list = Object.keys(docs).filter(k => k.startsWith(c + '/') && segs(k) === n).sort().map(snapDoc);
    return { docs: list, size: list.length, empty: !list.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  };

  async function call(method, p, body) {
    let r;
    try {
      r = await fetch('api/doc/' + p.split('/').map(encodeURIComponent).join('/'), {
        method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body)
      });
    } catch (e) { throw { code: 'unavailable', message: '连不上 NAS，请检查网络' }; }
    if (r.status === 401) { toLogin(); throw { code: 'unauthenticated', message: '需要重新登录' }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.code || 'unavailable', message: j.message || ('NAS 返回错误 ' + r.status) };
    // 先在本地生效，界面立刻更新；随后长轮询会带回服务器上的最新数据
    if (method === 'PUT') docs = { ...docs, [p]: clone(body) };
    else if (method === 'PATCH') docs = { ...docs, [p]: merge(docs[p] || {}, clone(body)) };
    else if (method === 'DELETE') { docs = { ...docs }; delete docs[p]; }
    notify();
  }

  const rid = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-4);
  function docRef(p) {
    return {
      id: p.split('/').pop(), path: p,
      get: async () => snapDoc(p),
      set: data => call('PUT', p, data),
      update: data => call('PATCH', p, data),
      delete: () => call('DELETE', p),
      onSnapshot(next) { const f = () => next(snapDoc(p)); subs.add(f); if (loaded) setTimeout(f, 0); return () => subs.delete(f); },
      collection: c => colRef(p + '/' + c),
    };
  }
  function colRef(c) {
    return {
      path: c,
      doc: id => docRef(c + '/' + (id || rid())),
      add: async data => { const r = docRef(c + '/' + rid()); await r.set(data); return r; },
      get: async () => snapCol(c),
      onSnapshot(next) { const f = () => next(snapCol(c)); subs.add(f); if (loaded) setTimeout(f, 0); return () => subs.delete(f); },
    };
  }

  const api = Object.freeze({ doc: docRef, collection: colRef });
  window.claude = { use: async name => name === 'db' ? api : null };
  poll();
})();

</script>
<title>车间生产看板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 布局：顶部工具条 + 订单进度条带 + 工人任务墙（每人一列，像车间里每台机位一块牌子） */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f6f8fa; --line:#d8dee5; --fg:#18222e; --mute:#5d6b7a;
  --accent:#24507f; --accent-fg:#ffffff; --accent-soft:#dde7f2;
  --ok:#1e7a46; --ok-bg:#e1f2e8; --part:#9a5b00; --part-bg:#fbeed6; --wait:#b3261e; --wait-bg:#fbe3e1;
  --p1:#0f7b78; --p2:#2d5fb5; --p3:#b0731a; --p4:#b2436a; --p5:#5f7424; --p6:#7656a6; --p7:#8a5636; --p8:#3f6680; --p9:#a8392b; --p10:#9a3d8c;
  --shadow:0 1px 2px rgba(20,35,55,.06),0 2px 8px rgba(20,35,55,.05);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1b222a; --panel2:#161c23; --line:#2c3640; --fg:#e4e9ee; --mute:#93a1af;
  --accent:#7fb0e6; --accent-fg:#0d1620; --accent-soft:#1f3247;
  --ok:#5fcf8c; --ok-bg:#163324; --part:#f0b55a; --part-bg:#3a2c12; --wait:#ff8a80; --wait-bg:#3d1c1a;
  --p1:#3cc2bd; --p2:#78a3ef; --p3:#e3a64e; --p4:#ee7ea4; --p5:#a9c25e; --p6:#b49ae6; --p7:#d9a07a; --p8:#8fb7d4; --p9:#f2907f; --p10:#e08ad3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1b222a; --panel2:#161c23; --line:#2c3640; --fg:#e4e9ee; --mute:#93a1af;
  --accent:#7fb0e6; --accent-fg:#0d1620; --accent-soft:#1f3247;
  --ok:#5fcf8c; --ok-bg:#163324; --part:#f0b55a; --part-bg:#3a2c12; --wait:#ff8a80; --wait-bg:#3d1c1a;
  --p1:#3cc2bd; --p2:#78a3ef; --p3:#e3a64e; --p4:#ee7ea4; --p5:#a9c25e; --p6:#b49ae6; --p7:#d9a07a; --p8:#8fb7d4; --p9:#f2907f; --p10:#e08ad3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* 顶部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;font-weight:900;letter-spacing:.02em}
.brand span{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--mute);font-weight:500}
.tab:hover{background:var(--panel2);color:var(--fg)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}

main.wrap{padding-block:18px 96px;display:flex;flex-direction:column;gap:18px}
.banner{background:var(--part-bg);color:var(--part);border-radius:8px;padding:10px 14px;font-weight:500}

/* 指标 */
.stats{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:6px;color:var(--mute)}
.stat b{font-family:var(--f-num);font-size:22px;color:var(--fg);font-weight:600}
.stat.bad b{color:var(--wait)}
.stat.swp b{color:var(--part)}
.tk.swapped{box-shadow:inset 0 0 0 2px var(--part)}
.swap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:3px 0;padding:3px 6px;border-radius:6px;background:var(--part-bg);color:var(--part);font-size:12px;font-weight:600}
.swap .swap-t{flex:1 1 auto}
.swap-by{display:inline-block;margin-left:4px;font-size:11px;font-weight:600;color:var(--part);background:var(--part-bg);border-radius:4px;padding:0 4px}
.legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* 工序标签 */
.pc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
.pc::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

/* 订单进度条带 */
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;font-weight:700}
.sec-h p{margin:0;color:var(--mute);font-size:13px}
.ostrip{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.orow{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:8px 20px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px}
.orow:first-child{border-top:0}
.orow:hover{background:var(--panel2)}
.on{display:flex;flex-direction:column;min-width:0}
.on b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on span{font-size:12px;color:var(--mute)}
.on .late{color:var(--wait);font-weight:700}
.obars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px}
.ob{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;min-width:0}
.ob em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--mute)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* 任务墙 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:box-shadow .12s}
.col.drop{box-shadow:0 0 0 2px var(--accent)}
.col.nodrop{box-shadow:0 0 0 2px var(--wait)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ch b{font-size:15px;font-weight:700}
.sk{display:flex;gap:8px;flex-wrap:wrap}
.alert{font-size:12px;font-weight:700;border-radius:6px;padding:4px 8px}
.alert.wait{background:var(--wait-bg);color:var(--wait)}
.alert.part{background:var(--part-bg);color:var(--part)}
.lab{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:500}
.q{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.tk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);cursor:grab;position:relative}
.tk:active{cursor:grabbing}
.tk.dragging{opacity:.4}
.tk.before::before{content:"";position:absolute;left:-4px;right:0;top:-5px;height:3px;border-radius:2px;background:var(--accent)}
.tk.after::after{content:"";position:absolute;left:-4px;right:0;bottom:-5px;height:3px;border-radius:2px;background:var(--accent)}
.tk-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pos{font-family:var(--f-num);font-size:11px;color:var(--mute)}
.tk-o{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-n{font-size:12px;color:var(--mute)}
.tk.now{padding:10px 12px}
.tk.now .tk-o{font-size:15px;font-weight:700}
.tk.now .tk-n .num{font-size:20px;color:var(--fg);font-weight:600}
.tk .bar{height:8px}
.av{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.av.ok{color:var(--ok)} .av.part{color:var(--part)} .av.wait{color:var(--wait)}
.tk-a{display:flex;gap:6px;justify-content:flex-end}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:5px;font-size:12px;padding:1px 8px;color:var(--mute)}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.fin{color:var(--ok)}
.mini.armed{background:var(--wait);border-color:var(--wait);color:var(--panel)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.idle{border:1px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;color:var(--mute);font-size:13px}
.hint{font-size:12px;color:var(--mute)}
/* 精简后的任务墙 */
.flag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
.flag.wait{background:var(--wait-bg);color:var(--wait)}
.flag.part{background:var(--part-bg);color:var(--part)}
.tk-p{font-size:13px;font-weight:700;color:var(--c)}
.tk.now{gap:2px}
.tk.now .tk-o{font-size:14px;font-weight:500;color:var(--mute)}
.tk.now .tk-n{font-size:13px}
.tk.now .tk-n .num{font-size:22px}
.tk .tk-a{display:none}
.tk:hover .tk-a,.tk:focus-within .tk-a,.tk:focus .tk-a{display:flex}
.tk:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
.nxl{gap:2px}
.tk.nx{box-shadow:none;border-width:0 0 0 3px;border-radius:4px;padding:4px 8px;background:var(--panel)}
.nx-l{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.nx-l .dot{color:var(--c);width:6px;height:6px}
.tk.nx.wait .nx-l .dot{color:var(--wait);width:8px;height:8px}
.tk.nx.part .nx-l .dot{color:var(--part);width:8px;height:8px}
.nx-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx-n{color:var(--mute);font-size:12px}
.nx-n::after{content:" 件"}
.tk.nx .tk-a{margin-top:4px}
.tk[data-task]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;margin:0;opacity:.95;box-shadow:0 10px 28px rgba(15,30,50,.28);list-style:none}
.ghost .tk-a{display:none!important}
body.pdragging,body.pdragging *{cursor:grabbing!important}
.tk.dragging{opacity:.35}
.grip{touch-action:none}
.col > .ch{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;justify-content:flex-start}
.col > .ch .flag{margin-left:auto}
.col.dragging,.prow-d.dragging{opacity:.35}
.col.colbefore{box-shadow:-4px 0 0 var(--accent)}
.col.colafter{box-shadow:4px 0 0 var(--accent)}
.ghost-row{max-height:220px;overflow:hidden;background:var(--panel)}

/* 一人一行的任务表 */
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bhead,.wrow{display:grid;grid-template-columns:minmax(110px,150px) minmax(220px,1.1fr) 1.6fr 1.4fr;gap:14px;align-items:center;padding:8px 14px}
.bhead{background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);letter-spacing:.06em;padding-block:6px}
.col.wrow{background:transparent;border:0;border-radius:0;border-top:1px solid var(--line);flex-direction:row;min-height:56px}
.col.wrow:first-of-type{border-top:0}
.col.wrow.bad{background:color-mix(in srgb,var(--wait-bg) 45%,transparent)}
.col.wrow.drop{box-shadow:inset 3px 0 0 var(--accent)}
.col.wrow.colbefore{box-shadow:inset 0 3px 0 var(--accent)}
.col.wrow.colafter{box-shadow:inset 0 -3px 0 var(--accent)}
.wrow > .ch{flex-wrap:nowrap;gap:6px}
.wrow > .ch b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wnow,.wnext{min-width:0}
.wnow .q{display:block}
.wrow .tk.now{box-shadow:none;border:1px solid var(--line);border-left:4px solid var(--c);padding:6px 10px;gap:2px;background:var(--panel)}
.now-l{display:flex;align-items:baseline;gap:4px 10px;min-width:0;flex-wrap:wrap}
.now-l .av{font-size:12px;white-space:nowrap}
.col.wrow{min-height:48px}
.ord-n{font-weight:700;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-l .ord-n{font-size:15px}
.now-n{display:flex;align-items:center;gap:6px}
.now-n .num{font-size:18px;font-weight:600}
.now-n .of{font-size:12px;color:var(--mute);white-space:nowrap}
.now-n .bar{flex:1;min-width:40px;max-width:160px;height:5px;display:block}
.wrow .idle{padding:8px;font-size:13px;border-style:dashed}
.wnext .nxl{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px}
.wnext .none{color:var(--line)}
.wrow .tk.nx{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:3px 8px;max-width:100%}
.wrow .nx-l{gap:5px;font-size:13px}
.wrow .nx-l .ord-n{font-weight:600;max-width:9em}
.nx-p{color:var(--c);font-weight:600;white-space:nowrap}
.wrow .tk.nx.before::before{left:-6px;top:0;bottom:0;right:auto;width:3px;height:auto}
.wrow .tk.nx.after::after{right:-6px;top:0;bottom:0;left:auto;width:3px;height:auto}
.wrow .tk.nx .tk-a{margin-top:3px}
/* 已做 */
.wdone{min-width:0;display:flex;flex-wrap:wrap;gap:4px 6px}
.wdone .none{color:var(--line)}
.dn{display:inline-flex;align-items:baseline;gap:5px;font-size:13px;background:var(--ok-bg);border-radius:6px;padding:2px 8px;max-width:100%}
.dn .ord-n{font-weight:600;max-width:8em}
.dn .num{color:var(--ok);font-size:14px}
.dn em{font-style:normal;font-size:11px;color:var(--ok);font-weight:600}
.dn{flex-wrap:wrap}
.wall-ticket-process{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.pc.wall-ticket-process::before{flex:none}
.dd{font-size:12px;color:var(--mute)}
.ost-w li{flex-wrap:wrap}
.ost-w .dd{flex-basis:100%;font-size:11px;line-height:1.3}
/* 任务墙上可以点去报工的地方 */
.jump-n,.dn,.ost-w li[data-act]{cursor:pointer}
.jump-n:hover{color:var(--accent);text-decoration:underline}
.dn:hover,.ost-w li[data-act]:hover{box-shadow:0 0 0 1px var(--accent)}
.ost-w li[data-act]{border-radius:4px;padding:1px 3px;margin:0 -3px}
.tk[data-act="jump"]{cursor:pointer}
/* 跳过来后闪一下 */
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 1.8s ease-out;border-radius:8px}
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}
/* 报工：颜色 尺码 数量 分行 */
.rw .rline{grid-template-columns:1fr;gap:6px}
.rw .rline .info{gap:1px}
.rlines{display:flex;flex-direction:column;gap:4px}
.rl{display:flex;align-items:center;gap:6px}
.rl .in{padding:4px 7px}
.rl .rc{flex:1 1 80px;min-width:0}
.rl .rs{flex:0 1 70px;min-width:0}
.rl .rq{flex:0 0 84px;text-align:left;font-family:var(--f-num)}
.rl .u{font-size:12px;color:var(--mute)}
.rl-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rl-f b{color:var(--fg)}
/* 按人员 / 按订单 切换 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg-b{border:0;background:transparent;padding:6px 14px;color:var(--mute);font-weight:500}
.seg-b[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
/* 按订单看 */
.oboxes{display:flex;flex-direction:column;gap:12px}
.obox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.obox-completed{border:2px solid #008075}
.obh{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.obh .ord-n{font-size:16px;overflow-wrap:anywhere}
.ob-summary{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.ob-toggle{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;
  flex:1 1 420px;min-width:0;border:0;border-radius:6px;padding:6px 7px;
  background:transparent;color:var(--fg);text-align:left
}
.ob-toggle:hover{background:var(--accent-soft)}
.ob-chevron{
  width:8px;height:8px;margin:0 3px;
  border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)
}
.ob-toggle[aria-expanded="true"] .ob-chevron{transform:translateY(-2px) rotate(45deg)}
.ob-toggle-label{font-size:12px;font-weight:700;white-space:nowrap;color:var(--accent)}
.ob-actions{display:flex;gap:6px;margin-inline-start:auto}
.ob-stages{display:flex;flex-direction:column;gap:10px}
.ob-stages[hidden]{display:none}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ost{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel2);min-width:0}
.ost-ticket-route{color:var(--mute);font-size:11px;overflow-wrap:anywhere}
.ost-n{display:flex;align-items:baseline;gap:4px}
.ost-n b{font-size:20px;font-weight:600}
.ost-n span{font-size:12px;color:var(--mute)}
.ost .bar{height:5px}
.ost-w{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.ost-w li{display:flex;align-items:baseline;gap:4px}
.ost-w .wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ost-w .of{font-size:11px;color:var(--mute)}
.ost-w em{font-style:normal;font-size:11px;color:var(--ok);font-weight:600;margin-left:4px}
/* 手工新建訂單的工序完工確認 */
.obox-manual .ogrid{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.ob-manual-tag{
  display:inline-block;background:var(--accent-soft);color:var(--accent);
  border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap
}
.ob-confirm-count{
  display:inline-flex;align-items:baseline;gap:4px;
  color:var(--mute);font-size:12px;white-space:nowrap
}
.ob-confirm-count b{color:var(--fg);font-size:16px;font-weight:700}
.ob-confirm-count.all,.ob-confirm-count.all b{color:var(--ok)}
.ost.ost-confirmed{border-top-color:var(--ok);background:var(--ok-bg)}
.ost-confirm{
  display:flex;align-items:center;gap:7px;min-height:41px;
  margin:auto -10px -8px;padding:7px 10px;border-top:1px solid var(--line);
  border-radius:0 0 7px 7px;
  color:var(--accent);font-size:12px;font-weight:650;cursor:pointer
}
.ost-confirm:hover{background:var(--accent-soft)}
.ost-confirm input[type="checkbox"]{
  flex:none;width:16px;height:16px;margin:0;accent-color:var(--ok);cursor:pointer
}
.ost-confirm:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.ost-confirm:has(input:disabled),.ost-confirm input:disabled{cursor:wait}
.ost-confirmed .ost-confirm{color:var(--ok)}
.ost-confirmed .ost-confirm:hover{background:var(--panel)}
.ob-confirm-warning{
  margin:0;padding:5px 9px;border-radius:6px;background:var(--part-bg);
  color:var(--part);font-size:12px
}
@media(max-width:520px){
  .ob-toggle{flex-basis:100%;padding-inline:4px}
  .ob-toggle-label{font-size:11px}
  .obox-manual .ogrid{grid-template-columns:minmax(0,1fr)}
  .ost-confirm{min-height:44px}
}
@media (max-width:760px){
  .bhead{display:none}
  .bhead,.wrow{grid-template-columns:1fr;gap:6px}
}

/* 通用面板与表单 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 14px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.danger{color:var(--wait)}
.btn.danger.armed{background:var(--wait);border-color:var(--wait);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--mute)}
.in{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;min-width:0;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.checks{display:flex;gap:6px 16px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{color:var(--fg);font-size:16px}

/* 订单页 */
.split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
.olist{display:flex;flex-direction:column;gap:6px}
.oitem{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.oitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.oitem .meta{font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px}
.badge.done{background:var(--ok-bg);color:var(--ok)}

/* 款式库和时间估算 */
.est{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;line-height:1.7}
.est b{color:var(--fg)}
.est.muted{background:var(--panel2);color:var(--mute)}
.est .in{width:90px;display:inline-block;padding:3px 7px;text-align:left;font-family:var(--f-num)}
.oproc .rate{margin-left:auto}
/* 加急 */
.urg{display:inline-flex;align-items:center;background:var(--wait);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap;line-height:1.6}
.btn.urgent-b{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 45%,var(--line))}
.btn.urgent-b:hover{background:var(--wait-bg);color:var(--wait);border-color:var(--wait)}
.panel.urgent{border-color:var(--wait);box-shadow:0 0 0 1px var(--wait)}
.ugp{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ugp h3{font-size:14px}
.ugt-wrap{overflow-x:auto}
.ugt{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
.ugt th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line);padding:4px 8px}
.ugt td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.ugt tr.skip td{color:var(--mute)}
.warn{color:var(--part);font-weight:600}
.ugsum{border-radius:8px;padding:10px 12px;font-size:14px}
.ugsum.ok{background:var(--ok-bg);color:var(--ok)}
.ugsum.bad{background:var(--wait-bg);color:var(--wait)}
.rates{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border-top:1px solid var(--line);padding-top:6px}
.rrow > b{min-width:5em}
.rate{display:inline-flex;align-items:center;gap:6px}
.rate .in{width:86px;text-align:left;font-family:var(--f-num)}
.alloc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.alloc h3{font-size:14px}
.plan-box{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.plan-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-head h3{font-size:14px;margin:0}
.plan-modes{display:flex;gap:4px;margin-left:auto}
.plan-modes .mini[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.plan-line{display:grid;grid-template-columns:minmax(80px,1fr) minmax(85px,130px) minmax(130px,1fr) auto;gap:7px;align-items:center}

.plan-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}

@media (max-width:560px){.plan-modes{margin-left:0;width:100%}.plan-line{grid-template-columns:minmax(0,1fr) 95px auto}.plan-line .plan-bed{grid-column:1/-1;grid-row:2}.plan-line button{grid-column:3;grid-row:1}.plan-foot .total{width:100%;text-align:right}}
.alloc .ugt{min-width:0}
/* 尺码行 */
.hxmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:8px 0}.hxmap h4{margin:4px 0}
.hxm{display:flex;align-items:center;gap:8px;margin:3px 0}.hxm span{flex:1;min-width:0;font-size:13px}.hxm select{width:130px;flex:none}
.hxs{padding:8px 10px}.hxs .ck{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hxr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 0 24px}
.hxpull{display:flex;flex-direction:column;gap:4px}.hxpull input{font:inherit;padding:2px 4px}
.hx-history-query .fld{flex:0 1 165px}
.hx-history-query .hint{margin:0 0 5px auto}
.hx-history-feedback{margin:0}
.hx-history-feedback.error{color:var(--wait)}
.hx-history-results{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hx-history-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:12px 12px 8px}
.hx-history-head .hint,.hx-history-foot{margin:0}
.hx-history-filters{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.hx-history-filter[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.hx-history-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1.12fr) repeat(3,minmax(70px,.65fr)) minmax(85px,.85fr);align-items:center;gap:9px;padding:8px 12px}
.hx-history-grid>span{min-width:0;overflow-wrap:anywhere}
.hx-history-columns{border-block:1px solid var(--line);background:var(--panel2);color:var(--mute);font-size:12px;font-weight:700}
.hx-history-row{width:100%;background:var(--panel);border:0;border-bottom:1px solid var(--line);text-align:left}
.hx-history-row:hover{background:var(--panel2)}
.hx-history-row[aria-expanded="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.hx-history-row:focus-visible{outline-offset:-2px}
.hx-history-order{font-weight:700}
.hx-history-order small,.hx-history-mobile-label{display:block;color:var(--mute);font-size:11px;font-weight:400}
.hx-history-mobile-label{display:none}
.hx-history-status{width:fit-content;border-radius:5px;padding:3px 7px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--mute)}

.hx-history-status.review{background:var(--part-bg);color:var(--part)}
.hx-history-detail{padding:8px 12px 12px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
.hx-history-detail .hint{margin:3px 0 0}
.hx-history-scans{width:min(540px,100%);max-width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;margin-top:6px}
.hx-history-scans th,.hx-history-scans td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.hx-history-scans th{font-weight:700;color:var(--mute)}
.hx-history-scans th:last-child,.hx-history-scans td:last-child{text-align:right}
.hx-history-foot,.hx-history-empty{padding:9px 12px}
@media(max-width:735px){
  .hx-history-query .fld{flex:1 1 112px}

  .hx-history-query .hint{margin-left:0}
  .hx-history-columns{display:none}
  .hx-history-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;font-size:13px}
  .hx-history-order{grid-column:1/3}
  .hx-history-step{grid-column:1/-1;grid-row:2}
  .hx-history-status{grid-column:3;grid-row:1;justify-self:end}

function daysLeft(due){
  if (!due) return null;
  const [y, m, d] = due.split('-').map(Number);
  const t = new Date(y, m-1, d), n = new Date(); n.setHours(0,0,0,0);

}

/* 这个任务现在能做多少：看本订单上一道工序做了多少 */
function avail(t){
  const o = S.orders[t.orderId];
  const left = Math.max(0, t.target - t.done);
  if (!o) return { cls:'wait', text:'订单已删除' };
  const up = prevStep(o, stepOf(t));
  if (!up) return { cls:'ok', text:'第一道工序，可直接做', short:'' };
  const upDone = stepDone(o.id, up.id), cur = stepDone(o.id, stepOf(t)), pool = Math.max(0, upDone - cur);
  const un = stepName(o, up.id);
  if (upDone >= o.qty) return { cls:'ok', text:`${un}已全部做完`, short:'' };
  if (pool >= left) return { cls:'ok', text:`${un}已备够 ${left} 件`, short:'' };
  if (pool > 0) return { cls:'part', text:`${un}还在做，现在只有 ${pool} 件可做`, short:`只有 ${pool} 件可做` };
  return { cls:'wait', text:`等${un}，现在 0 件可做`, short:`等${un}` };
}

function workerAlert(wid){
  const q = queue(wid);
  if (!q.length) return { cls:'wait', text:'手上没活了，需要派工' };
  const a = avail(q[0]);
  if (a.cls === 'wait') return { cls:'wait', text:'当前任务缺上道活，会停工' };
  if (q.length === 1 && q[0].target - q[0].done <= 0) return null;
  if (q.length === 1) return { cls:'part', text:'做完这个就没活了' };
  return null;
}

  catch (e) {
    const msg = e?.code === 'invalid_argument' ? '你可能只有查看权限，请让看板主人把你设为可编辑'
      : e?.code === 'quota_exceeded' ? '数据已存满，请先归档或删除旧订单' : (e?.message || '请稍后再试');

  }
}
function seqAt(list, index){
  const prev = list[index-1]?.seq, next = list[index]?.seq;
  if (prev == null && next == null) return Date.now();
  if (prev == null) return next - 1024;
  if (next == null) return prev + 1024;
  return (prev + next) / 2;
}

/* 换人做：派给 A 的工序，实际记在了 B 身上（打票软件扫票或「报其他活」记上的临时任务）

function swapSubs(t){

  const list = Object.entries(by).map(([wid, q]) => ({ wid, q })).sort((a, b) => b.q - a.q);

async function setStageConfirmation(input){
  const { stageOrder:oid, stageStep:sid } = input.dataset;
  const order = S.orders[oid], id = stageCheckId(oid, sid);
  if (!isManualStageOrder(order) || !stepsOf(order).some(step => step.id === sid)) { render(); return; }
  if (stageChecksPending.has(id)) return;
  const checked = input.checked;
  stageChecksPending.add(id);
  input.disabled = true;
  try {
    await save(db => db.doc('orders/' + oid).update({ stageConfirmations:{ [sid]:checked } }),
      checked ? '已确认这道工序完成' : '已取消这道工序的完成确认');
  } finally {
    stageChecksPending.delete(id);
    render();
  }
}

/* ---------- 加急排单 ----------
   每道工序从原来负责的人手上拆出加急数量，排到他最前面；按流水作业估算时间 */
const HM = s => { const [h, m] = String(s || '').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const workDay = () => { const w = S.cfg?.workHours || {}; return { start:w.start || '08:00', end:w.end || '18:00' }; };
const hoursPerDay = () => { const w = workDay(); return Math.max(1, (HM(w.end) - HM(w.start)) / 60); };
const rateOf = (wid, pid) => Number(S.cfg?.rates?.[wid]?.[pid]) || 0; // 条/天
/* 从现在到交期，一共还有多少个上班小时 */
function workHoursUntil(dueStr){
  const w = workDay(), s0 = HM(w.start), e0 = HM(w.end), due = new Date(dueStr);
  if (isNaN(due)) return 0;
  let t = new Date(), mins = 0;
  for (let i = 0; i < 400 && t < due; i++) {
    const day = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const ds = new Date(day.getTime() + s0 * 60000), de = new Date(day.getTime() + e0 * 60000);

function planUrgent(o, qty){
  const st = stepsOf(o), hpd = rateHours(), rows = [];
  const load = {}; workers().forEach(w => { load[w.id] = sum(queue(w.id), t => Math.max(0, t.target - t.done)); });
  for (const s of st) {
    const name = nameIn(st, s.id);
    const act = allTasks().filter(t => t.orderId === o.id && stepOf(t) === s.id && t.status !== 'done' && !t.urgent)

    let wid, from = null, take = 0, note = '';

      take = Math.min(qty, left);
      note = `从「${wname(wid)}」的 ${left} 件里拆出 ${take} 件` + (take < qty ? `（原任务只剩 ${left} 件，加急按 ${qty} 件算）` : '');
    } else {
      if (stepDone(o.id, s.id) >= o.qty) { rows.push({ sid:s.id, p:s.p, name, skip:'这道工序已经全部做完' }); continue; }
      const able = workers().filter(w => (w.skills || []).includes(s.p)).sort((a, b) => load[a.id] - load[b.id]);
      if (!able.length) { rows.push({ sid:s.id, p:s.p, name, skip:'这道还没派工，也没有人常做' }); continue; }
      wid = able[0].id; note = '这道还没派工，派给常做的人里最闲的';

    load[wid] += qty;
    const sr = styleRate(styleOf(o), st, s.id), r = sr || rateOf(wid, s.p), hours = r ? qty / (r / hpd) : null;
    rows.push({ sid:s.id, p:s.p, name, wid, from: from ? from.id : null, take, hours, rate:r, rsrc: sr ? '款式库' : '这个人', note });

  const per = {};

/* ---------- 款式库：每个款式的工序路线 + 每道工序一个人一天能做多少条 ---------- */
const styles = () => S.cfg?.styles || [];
/* 按名称找款式：名称或「其他叫法」里有一样的都算 */
const styleByName = name => { const n = String(name || '').trim(); return n ? (styles().find(s => s.name === n) || styles().find(s => (s.aliases || []).includes(n))) : null; };
const styleOf = o => o ? (styles().find(s => s.id === o.styleId) || styleByName(o.style)) : null;
/* 订单的某一步在款式库里的日产能；同一道工序出现多次时按第几次对应 */
function styleRate(sty, steps, sid){
  if (!sty) return 0;
  const s = steps.find(x => x.id === sid); if (!s) return 0;
  const nth = steps.filter(x => x.p === s.p).indexOf(s);
  const cand = (sty.steps || []).filter(x => x.p === s.p);
  return Number((cand[nth] || cand[0] || {}).rate) || 0;

/* 从现在起，再干 hours 个上班小时，是几号几点 */
function addWorkHours(hours){
  const w = workDay(), s0 = HM(w.start), e0 = HM(w.end);
  let t = new Date(), left = hours * 60;
  for (let i = 0; i < 1000; i++) {
    const day = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const ds = new Date(day.getTime() + s0 * 60000), de = new Date(day.getTime() + e0 * 60000);
    const a = t > ds ? t : ds;
    if (a < de) { const can = (de - a) / 60000; if (can >= left) return new Date(a.getTime() + left * 60000); left -= can; }
    t = new Date(day.getTime() + 86400000);
  }

}
function fmtWhen(d){
  if (!d) return '—';
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const dd = new Date(d); dd.setHours(0, 0, 0, 0);
  const diff = Math.round((dd - day0) / 86400000);
  const label = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '后天' : `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${label} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* ---------- 时间估算（流水作业） ----------
   单位统一用「干活小时」：一个人一小时做 日产能 ÷ 每天干几小时 条。
   换算成几号几点时，按「每天上班 X 小时里干 Y 小时」把吃饭休息补进去（calFactor）。

   每道工序（按路线顺序）：
   - 开工 = 较晚的那个：第一扎送到（arr），这个人做完排在前面的活（wait / busy）
   - 做完 = 较晚的那个：开工 + 自己把件数做完，上一道做完 + 再做最后一扎
   从零开始时，这等于「第一扎走完所有工序 + 剩下的件数在最慢那道上的时间」。
   items：[{ q:件数, r:条/天, w:工人 id, wait:他前面还有多少干活小时, ready:前面已有一扎半成品, stocked:前面的半成品已够做完这道 }]
   已做完的工序（q=0）说明料已备好；同一个人做几道工序时一道道排。
   steady = 流水线已经在做这一款、前面都有半成品时，最快要多久（最慢那道，或最忙那个人） */
const flowBatch = () => Math.max(1, parseInt(S.cfg?.flowBatch, 10) || 30);
const rateHours = () => Math.max(1, Number(S.cfg?.rateHours) || 10);
const calFactor = () => Math.max(1, hoursPerDay() / rateHours());
function estimate(items){
  const rh = rateHours(), b = flowBatch(), busy = {}, load = {};
  let prev = 0, arr = 0, end = 0, unknown = 0, steady = 0;
  for (const x of items) {
    if (!(x.q > 0)) { prev = 0; arr = 0; continue; }
    if (!(x.r > 0)) { unknown++; continue; }
    const perH = x.r / rh, own = x.q / perH, one = Math.min(b, x.q) / perH;
    const free = x.w ? (busy[x.w] ?? (x.wait || 0)) : (x.wait || 0);
    const start = Math.max(x.ready ? 0 : arr, free);
    const fin = Math.max(start + own, x.stocked ? 0 : prev + one);
    if (x.w) { busy[x.w] = fin; load[x.w] = (load[x.w] || 0) + own; steady = Math.max(steady, load[x.w]); }

}
/* mode：now = 如果马上开工；queue = 按现在的排队顺序 */
function estText(e, lead, mode){
  if (!e) return '';
  if (e.unknown && !e.hours) return `<b>还算不出来</b>：有 ${e.unknown} 道工序没填日产能，去款式库填上就能估算`;
  const base = `${lead}约要干 <b>${fmtH(e.hours)}</b> 的活（约 ${e.days.toFixed(1)} 个工作日）`;
  if (e.unknown) return `${base}；有 ${e.unknown} 道工序没填日产能，没算进去，实际会更久`;
  const how = mode === 'queue' ? '按现在的排队顺序' : '如果马上开工';
  const st = mode !== 'queue' && e.steady && e.hours - e.steady > 0.3 ? `；如果流水线已经在做这一款（前面工序都有半成品），最快约 <b>${fmtH(e.steady)}</b>` : '';
  const ahead = e.unknownAhead ? `；排在前面的活里有 ${e.unknownAhead} 个没有日产能，排队时间可能算少了` : '';
  return `${base}，${how}，预计 <b>${fmtWhen(e.finish)}</b> 做完（已算上吃饭休息）${st}${ahead}`;
}
/* 一个任务还剩多少干活小时：先看它所在订单的款式库，再看这个人的日产量 */
function taskHours(t){
  const o = S.orders[t.orderId], left = Math.max(0, t.target - t.done);
  if (!left) return 0;
  const r = (o ? styleRate(styleOf(o), stepsOf(o), stepOf(t)) : 0) || rateOf(t.workerId, t.process);
  return r ? left / (r / rateHours()) : null;

/* 在产订单剩下的活：按每道工序负责人现在的排队顺序 */
function orderEstimate(o){
  const sty = styleOf(o); if (!sty) return null;
  const st = stepsOf(o); if (!st.length) return null;
  let unknownAhead = 0;
  const items = st.map((s, i) => {
    const q = Math.max(0, o.qty - stepDone(o.id, s.id));
    const pool = i ? stepDone(o.id, st[i - 1].id) - stepDone(o.id, s.id) : Infinity;
    const act = allTasks().filter(t => t.orderId === o.id && stepOf(t) === s.id && t.status !== 'done').sort((a, b) => (b.target - b.done) - (a.target - a.done));
    const w = act[0]?.workerId;
    let wait = 0;
    if (w && q) {
      const qa = queue(w), idx = qa.findIndex(t => t.orderId === o.id);
      for (const t of qa.slice(0, Math.max(0, idx))) { const h = taskHours(t); if (h == null) unknownAhead++; else wait += h; }
    }
    return { q, r:styleRate(sty, st, s.id), w, wait, ready: pool >= Math.min(flowBatch(), q), stocked: pool >= q };
  });
  const e = estimate(items); e.unknownAhead = unknownAhead; return e;
}

/* ---------- 日报：每个款式 / 颜色 / 尺码，每道工序还剩多少、成品还剩多少 ----------
   同一个款的几张在产单合在一起；格子 = 计划 - 这道工序所有人做的（扫票和手工都算）；成品按最后一道算 */
/* 悬停明细先在每张订单内按真实步骤 id 计算，再按卡片名称汇总；不能从合并后的相邻列相减。 */
function dailyReadyForOrder(o, steps, names, orderTasks){
  const unavailable = reason => steps.map(() => ({ reason, rows:[] }));
  const bd = Array.isArray(o.breakdown) ? o.breakdown : [];
  if (!bd.length || bd.some(x => !String(x.s || '').trim())) return unavailable('订单未建立完整尺码计划，需先核对');
  const plan = {};
  for (const x of bd) {
    const q = Number(x.q), k = `${x.c || o.color || ''}|${x.s || ''}`;
    if (!Number.isFinite(q) || q < 0) return unavailable('订单尺码计划有误，需先核对');
    plan[k] = (plan[k] || 0) + q;
  }
  if (sum(Object.values(plan), x => x) !== Number(o.qty)) return unavailable('尺码计划与订单数量不符，需先核对');
  const counts = steps.map(st => {
    const done = {}; let reason = '';
    for (const t of orderTasks) {
      if (stepOf(t) !== st.id) continue;
      let detailed = 0;
      for (const [k, raw] of Object.entries(t.dist || {})) {
        const q = Number(raw);
        if (!Number.isFinite(q) || q < 0) { reason = '报工尺码数量有误，需先核对'; continue; }
        if (k === '|') continue;
        if (q && !(k in plan)) reason = '报工尺码与计划不符，需先核对';
        detailed += q;
        done[k] = (done[k] || 0) + q;
      }
      if (detailed !== Number(t.done || 0)) reason = '报工缺少颜色尺码明细，需先核对';
    }
    return { done, reason };

    if (names.indexOf(names[i]) !== names.lastIndexOf(names[i])) return { reason:'订单有重复同名工序，需先核对', rows:[] };
    const curr = counts[i], prev = i ? counts[i - 1] : null;
    if (curr.reason || prev?.reason) return { reason:curr.reason || prev.reason, rows:[] };
    const rows = Object.entries(plan).map(([k, qty]) => {
      const now = curr.done[k] || 0, available = i ? prev.done[k] || 0 : qty;
      const [c, s] = k.split('|');

function dailyData(){
  const by = {};
  for (const o of activeOrders()) {
    const steps = stepsOf(o); if (!steps.length) continue;
    // 同一款式不同颜色分开列
    const name = o.style || orderLabel0(o), color = o.color || '', key = name + '|' + color;
    const G = by[key] || (by[key] = { style:name, color, label:color ? name + ' · ' + color : name, orders:0, routes:new Set(), steps:[], rows:{}, ready:Object.create(null), unsized:0, oids:[] });
    G.orders++; G.oids.push(o.id);
    G.beds = [...new Set([...(G.beds || []), ...bedsOf(o)])];
    const names = steps.map(st => stepName(o, st.id));
    G.routes.add(names.join('→'));
    names.forEach((n, i) => { if (G.steps.some(x => x.n === n)) return;
      const at = i > 0 ? G.steps.findIndex(x => x.n === names[i - 1]) + 1 : 0;
      G.steps.splice(i === 0 ? 0 : (at > 0 ? at : G.steps.length), 0, { n, p:steps[i].p }); });
    const bd = Array.isArray(o.breakdown) && o.breakdown.length ? o.breakdown : [{ c:o.color || '', s:'', q:o.qty }];
    const orderTasks = allTasks().filter(t => t.orderId === o.id);
    const row = (c, z) => { const k = c + '|' + z; return G.rows[k] || (G.rows[k] = { c, s:z, plan:0, done:{}, today:0 }); };
    bd.forEach(x => { row(x.c || o.color || '', x.s || '').plan += Number(x.q) || 0; });
    steps.forEach((st, i) => {
      const n = names[i], last = i === steps.length - 1;
      orderTasks.forEach(t => {
        if (stepOf(t) !== st.id) return;
        let sz = 0;
        for (const [k, v] of Object.entries(t.dist || {})) { const q = Number(v) || 0; if (!q || k === '|') continue; const [c, z] = k.split('|'); const r = row(c, z); r.done[n] = (r.done[n] || 0) + q; sz += q; }
        G.unsized += Math.max(0, (Number(t.done) || 0) - sz);
        if (last) { const L = S.log.lines?.[t.id]; if (Array.isArray(L)) L.forEach(l => { row(l.c || '', l.s || '').today += Number(l.q) || 0; }); }
      });
    });
    dailyReadyForOrder(o, steps, names, orderTasks).forEach((r, i) => {
      const n = names[i], target = G.ready[n] || (G.ready[n] = { rows:{}, reason:'' });
      if (r.reason) target.reason ||= r.reason;
      else r.rows.forEach(x => { const k = `${x.c}|${x.s}`, part = target.rows[k] || (target.rows[k] = { c:x.c, s:x.s, q:0 }); part.q += x.q; });
    });
  }

    const lastN = G.steps[G.steps.length - 1].n;
    const rows = Object.values(G.rows).map(r => ({ ...r, extra:!r.plan, fin:Math.min(r.plan, r.done[lastN] || 0), left:Math.max(0, r.plan - (r.done[lastN] || 0)) }))
      .sort((a, b) => String(a.c).localeCompare(String(b.c)) || sizeRank(a.s) - sizeRank(b.s));
    const sumOf = f => rows.reduce((a, r) => a + f(r), 0);

function dwLog(day){

function dwData(log){
  const tk = {}; allTasks().forEach(t => { tk[t.id] = t; });
  const ws = {}; let lost = 0;
  for (const [tid, n0] of Object.entries(log.entries || {})) {
    const n = Number(n0) || 0; if (!n) continue;
    const t = tk[tid]; if (!t) { lost += n; continue; }
    const order = S.orders[t.orderId], o = order || {}, sid = stepOf(t);
    const styleName = o.style || orderLabel0(o) || (order ? '未知款式' : '订单已删除');
    const style = styleName + (o.color ? ' · ' + o.color : '');
    const route = stepsOf(o), stage = route.find(x => x.id === sid);
    let step = order ? nameIn(route, sid) : '未知工序';
    if (stage?.gx) {
      const repeats = route.filter(x => x.p === stage.p && x.gx === stage.gx);
      if (repeats.length > 1) step += `（第 ${repeats.indexOf(stage) + 1} 次）`;
    }
    const forWho = t.adhoc ? swapOwners(t.workerId, t.orderId, sid).map(wname).join('、') : '';
    const w = ws[t.workerId] || (ws[t.workerId] = { id:t.workerId, name:wname(t.workerId), total:0, items:{} });
    const key = JSON.stringify([t.orderId, sid, forWho]);
    const processKey = JSON.stringify(stage ? [stage.p, step, forWho] : [t.orderId, sid, forWho]);
    const it = w.items[key] || (w.items[key] = { oid:t.orderId, style, styleName, step, processKey, forWho, q:0, sz:{} });
    w.total += n; it.q += n;
    const L = log.lines?.[tid];
    if (Array.isArray(L)) L.forEach(l => {
      const c = String(l.c || '').trim(), s = String(l.s || '').trim(), k = JSON.stringify([c, s]);
      const z = it.sz[k] || (it.sz[k] = { c, s, q:0 }); z.q += Number(l.q) || 0;

  return { lost, ws:Object.values(ws).map(w => ({ ...w, items:Object.values(w.items) })).sort((a, b) => b.total - a.total) };
}

function hxStylePlan(){

  const pending = Number.isFinite(row.counted) && Number.isFinite(row.synced) ? row.counted - row.synced : 0;
  const title = row.unlinked ? '需关联单号' : status === 'ready' && pending > 0 ? '可补登 ' + hxHistoryQty(pending) : HX_HISTORY_LABELS[status];

    <b>${title}</b>${row.reason ? `<p class="hint">${esc(row.reason)}</p>` : ''}

async function hxHistoryRun(form){
  if (S.hxBusy) return;
  const since = form.querySelector('#hx-history-since').value;
  const until = form.querySelector('#hx-history-until').value;
  if (!hxHistoryDay(since) || !hxHistoryDay(until) || since > until || until > hxHistoryRange().lastDay){
    S.hxHistoryError = '请选择有效日期，开始日不得晚于截止日，截止日最晚为昨天。';
    render(); return;
  }
  S.form['hx-history-since'] = since; S.form['hx-history-until'] = until;
  S.hxHistoryResult = null; S.hxHistoryError = ''; S.hxHistoryFilter = 'all'; S.hxHistoryOpen = null;
  S.hxBusy = 'history'; render();
  const query = new URLSearchParams({ since, until });
  const result = await hxCall('historicalscan?' + query.toString(), 'GET');
  S.hxBusy = false;
  if (result?.ok && Array.isArray(result.rows)) S.hxHistoryResult = result;
  else S.hxHistoryError = result?.message || '暂时读取不到核对结果，请稍后再试。';
  if (S.view === 'settings') render();
}

/* 同步默认从最近一次导入的裁剪日期开始读（导入过的单号会自动跳过） */
function hxDefaultSince(){
  let d = '';
  Object.values(S.orders).forEach(o => { String(o.source?.date || '').split(/[、,\s]+/).forEach(x => { if (/^\d{4}-\d{2}-\d{2}$/.test(x) && x > d) d = x; }); });
  if (d) return d;
  const t = new Date(Date.now() - 7 * 864e5);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}
/* ---------- 导入裁剪单 Excel（打票软件「生产排产明细表 / 裁剪单明细表」导出） ----------
   一行一包：日期、单号、货号、款号、裁床号、包号、颜色、尺码、数量。
   同一次导入里，同款号、同颜色的单号合成一张订单；导入过的单号以后不再导入 */
let XLSXLIB = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (XLSXLIB) return XLSXLIB;
  XLSXLIB = new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX);
    s.onerror = () => { XLSXLIB = null; bad(new Error('读取 Excel 的组件下载失败，请确认这台电脑能上网')); };
    document.head.appendChild(s);
  });
  return XLSXLIB;
}
const baseStyleName = n => String(n || '').replace(/[（(][^）)]*[）)]/g, '').trim();
function matchStyle(name){ return styleByName(name) || styleByName(baseStyleName(name)) || null; }
const importedNos = () => { const set = new Set(); Object.values(S.orders).forEach(o => { const s = o.source || {}; (s.nos || (s.no ? [s.no] : [])).forEach(n => set.add(String(n))); }); return set; };

function parseCutRows(rows){
  const hi = rows.findIndex(r => r.some(c => String(c).trim() === '单号') && r.some(c => /数量/.test(String(c))));
  if (hi < 0) throw new Error('没找到表头：第一行应该有「单号」「数量」这些列');
  const H = rows[hi].map(c => String(c).trim());
  const col = (...names) => { for (const n of names) { const i = H.findIndex(h => h === n); if (i >= 0) return i; } for (const n of names) { const i = H.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
  const C = { date:col('日期'), no:col('单号'), item:col('货号'), style:col('款号', '款式', '品名'), bed:col('裁床号', '裁床'), bag:col('包号', '扎号'), color:col('颜色'), size:col('尺码'), qty:col('数量') };
  if (C.no < 0 || C.qty < 0 || C.style < 0) throw new Error('缺少「单号」「款号」或「数量」这几列');
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const no = String(r[C.no] ?? '').trim(), q = Number(String(r[C.qty] ?? '').replace(/,/g, ''));
    if (!no || no === '单号' || !(q > 0)) continue;   // 跳过表头、页脚、合计、空行
    const g = i => i < 0 ? '' : String(r[i] ?? '').trim();
    out.push({ date:g(C.date).replace(/\//g, '-'), no, item:g(C.item), style:g(C.style), bed:g(C.bed), bag:g(C.bag), color:g(C.color), size:g(C.size), q });
  }
  return { rows:out, cols:C };
}
function planCutImport(parsed, fileName){
  const done = importedNos(), groups = new Map(), skipped = new Set();
  for (const r of parsed.rows) {
    if (done.has(r.no)) { skipped.add(r.no); continue; }
    const k = r.style + '|' + r.item + '|' + r.color;
    if (!groups.has(k)) groups.set(k, { style:r.style, item:r.item, color:r.color, rows:[] });
    groups.get(k).rows.push(r);
  }
  const list = [...groups.values()].map(g => {
    const bd = new Map(), bedBd = new Map();
    const bedMapReady = g.rows.every(r => !!r.bed);
    g.rows.forEach(r => {
      const k = JSON.stringify([r.color, r.size]); bd.set(k, (bd.get(k) || 0) + r.q);
      if (r.bed) { const bk = JSON.stringify([r.bed, r.color, r.size]); bedBd.set(bk, (bedBd.get(bk) || 0) + r.q); }
    });
    const sty = matchStyle(g.style);
    return { ...g, qty:sum(g.rows, r => r.q), nos:[...new Set(g.rows.map(r => r.no))], beds:[...new Set(g.rows.map(r => r.bed).filter(Boolean))],
      bundles:g.rows.length, dates:[...new Set(g.rows.map(r => r.date).filter(Boolean))].sort(), sty,
      breakdown:[...bd].map(([k, q]) => { const [c, s] = JSON.parse(k); return { c, s, q }; }),
      bedMapReady, bedBreakdown:bedMapReady ? [...bedBd].map(([k, q]) => { const [bed, c, s] = JSON.parse(k); return { bed, c, s, q }; }) : [] };
  });
  return { file:fileName, groups:list, skipped:[...skipped], rows:parsed.rows.length };
}

  </div>`;

/* 颜色尺码明细文字，例如「白色 L 400 · 黑色 M 200 · 未分 100」 */
function distText(dist, total){
  const e = Object.entries(dist || {}).filter(([k, n]) => n > 0 && k !== '|');
  if (!e.length) return '';
  const spec = e.reduce((s, [, n]) => s + n, 0), rest = (Number(total) || 0) - spec;
  const parts = e.sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k.split('|').filter(Boolean).join(' ')} ${n}`);
  if (rest > 0) parts.push(`未分 ${rest}`);
  return parts.join(' · ');
}

/* ---------- 视图：订单与派工 ---------- */
function val(id, d){ return S.form[id] ?? d; }
const dv = id => document.getElementById(id)?.value ?? '';
const planTotal = rows => sum(rows, r => { const q = Number(r.q); return Number.isInteger(q) && q > 0 ? q : 0; });
function planDraft(key, o){
  if (key === 'new') return S.newPlan || (S.newPlan = { mode:'sizes', rows:[{ id:rid('z'), s:'', q:'', bed:'' }] });
  if (!S.editPlans[key]) {
    const bd = Array.isArray(o?.breakdown) ? o.breakdown : [];
    const bedBd = Array.isArray(o?.bedBreakdown) ? o.bedBreakdown : [];
    const bedFor = x => String(bedBd.find(b => b.c === x.c && b.s === x.s)?.bed || '');
    S.editPlans[key] = { mode:bd.length ? 'sizes' : 'total', base:JSON.stringify({ color:o?.color || '', breakdown:bd, bedBreakdown:bedBd, qty:o?.qty }), rows:bd.length ? bd.map(x => ({ id:rid('z'), s:String(x.s || ''), q:String(x.q || ''), bed:bedFor(x) })) : [{ id:rid('z'), s:'', q:'', bed:'' }] };
    if (bd.length) S.form['eo-qty-' + key] = String(planTotal(S.editPlans[key].rows));
  }
  return S.editPlans[key];
}
function checkedPlan(d, color){
  if (color.includes('|')) return { error:'颜色不能包含竖线符号 |' };
  if (d.mode !== 'sizes') return { breakdown:[], bedBreakdown:[] };
  if (!color) return { error:'按尺码填写时请先填颜色' };
  if (!d.rows.length) return { error:'请至少添加一个尺码' };
  const rows = d.rows.map(r => ({ s:String(r.s || '').trim(), q:Number(r.q), bed:String(r.bed || '').trim() }));
  if (rows.some(r => !r.s || !Number.isInteger(r.q) || r.q <= 0)) return { error:'每个尺码都要填写大于 0 的整数件数' };
  if (rows.some(r => r.s.includes('|'))) return { error:'尺码不能包含竖线符号 |' };
  if (new Set(rows.map(r => r.s.toUpperCase())).size !== rows.length) return { error:'同一尺码请合并到一行' };
  if (rows.some(r => /[、,，\s]/.test(r.bed))) return { error:'每个尺码行只填一个裁床号，不要用空格或顿号分隔' };
  return { qty:planTotal(rows), breakdown:rows.map(r => ({ c:color, s:r.s, q:r.q })), bedBreakdown:rows.filter(r => r.bed).map(r => ({ bed:r.bed, c:color, s:r.s, q:r.q })) };
}
function syncPlanTotal(key){
  const d = planDraft(key, S.orders[key]); if (d.mode !== 'sizes') return;
  const q = planTotal(d.rows), id = key === 'new' ? 'no-qty' : 'eo-qty-' + key;
  S.form[id] = q ? String(q) : '';
  const input = document.getElementById(id); if (input) input.value = S.form[id];
  const total = document.getElementById('plan-total-' + key); if (total) total.textContent = q.toLocaleString('zh-CN');
  if (key === 'new') { const box = document.getElementById('no-style-box'); if (box) box.innerHTML = newOrderStyleBox(); }
}
function planBlock(key, o){
  const d = planDraft(key, o), colorId = key === 'new' ? 'no-color' : 'eo-color-' + key;
  const color = String(val(colorId, o?.color || '')).trim();
  const rows = d.mode === 'sizes' ? `<div class="hint">尺码 · 计划件数 · 裁床号（可不填）</div>${d.rows.map(r => `<div class="plan-line">
    <input class="in" id="pl-s-${key}-${r.id}" data-plan-key="${esc(key)}" data-plan-row="${r.id}" data-plan-field="s" list="dl-sizes" placeholder="尺码，如 XL" value="${esc(r.s)}">
    <input class="in" id="pl-q-${key}-${r.id}" data-plan-key="${esc(key)}" data-plan-row="${r.id}" data-plan-field="q" type="number" min="1" step="1" inputmode="numeric" placeholder="件数" value="${esc(r.q)}">
    <input class="in plan-bed" id="pl-bed-${key}-${r.id}" data-plan-key="${esc(key)}" data-plan-row="${r.id}" data-plan-field="bed" placeholder="裁床号（可不填）" value="${esc(r.bed || '')}">
    <button class="mini" data-act="plan-del" data-key="${esc(key)}" data-row="${r.id}">删除</button></div>`).join('')}
    <div class="plan-foot"><button class="mini" data-act="plan-add" data-key="${esc(key)}">＋ 添加尺码</button><span class="total">合计 <span class="num" id="plan-total-${esc(key)}">${planTotal(d.rows).toLocaleString('zh-CN')}</span> 件</span></div>`
    : '<p class="hint">不分尺码时直接填写上面的订单总数；若要在日报按尺码看进度，请先补上尺码计划。</p>';
  return `<div class="plan-box"><div class="plan-head"><h3>颜色和计划尺码数量</h3>
    <div class="plan-modes"><button class="mini" data-act="plan-mode" data-key="${esc(key)}" data-mode="sizes" aria-pressed="${d.mode === 'sizes'}">按尺码填</button>
      <button class="mini" data-act="plan-mode" data-key="${esc(key)}" data-mode="total" aria-pressed="${d.mode === 'total'}">只填总数</button></div></div>
    ${key === 'new' ? '' : `<div class="plan-color"><label class="fld"><span>颜色</span><input class="in" id="${esc(colorId)}" list="dl-colors" placeholder="按尺码填时必填" value="${esc(color)}"></label></div>`}
    <p class="hint">当前颜色：<b id="plan-color-name-${esc(key)}">${esc(color || '未分颜色')}</b>。一张订单对应一种颜色；尺码件数合计作为订单总数。</p>
    ${rows}${datalists()}</div>`;
}

      </div>` : `<div class="hint">还没有工人，去设置页添加。</div>`}
    </div>`;
  }
  return h + `</div>`;
}

/* ---------- 渲染 ---------- */
function closeDrPopup(restoreFocus = false){
  clearTimeout(DR_HIDE_TIMER); DR_HIDE_TIMER = null;
  if (!DR_POP) return;
  const { card, pop } = DR_POP;
  card.setAttribute('aria-expanded', 'false');
  card.removeAttribute('aria-controls');
  pop.remove(); DR_POP = null;
  if (restoreFocus && card.isConnected) {
    DR_SUPPRESS_FOCUS = true;
    card.focus({ preventScroll:true });
    queueMicrotask(() => { DR_SUPPRESS_FOCUS = false; });
  }
}
let DR_SUPPRESS_FOCUS = false;
function positionDrPopup(){
  if (!DR_POP) return;
  const { card, pop } = DR_POP, r = card.getBoundingClientRect();
  if (!card.isConnected || r.bottom < 0 || r.top > window.innerHeight) { closeDrPopup(); return; }
  const w = Math.min(368, window.innerWidth - 24);
  pop.style.width = w + 'px';
  const h = pop.offsetHeight;
  let x, y;
  if (window.innerWidth >= 900 && r.right + 8 + w <= window.innerWidth - 12) {
    x = r.right + 8; y = r.top;
  } else if (window.innerWidth >= 900 && r.left - 8 - w >= 12) {
    x = r.left - 8 - w; y = r.top;
  } else {
    x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
    y = r.bottom + 8;
    if (y + h > window.innerHeight - 12 && r.top - h - 8 >= 12) y = r.top - h - 8;
  }
  pop.style.left = Math.round(x) + 'px';
  pop.style.top = Math.round(Math.max(12, Math.min(y, window.innerHeight - h - 12))) + 'px';
}
function showDrPopup(card, pinned = false){
  const group = DR_READY[Number(card.dataset.drG)], i = Number(card.dataset.drI), stage = group?.st[i];
  if (!stage || S.view !== 'daily') return;
  clearTimeout(DR_HIDE_TIMER); DR_HIDE_TIMER = null;
  closeDrPopup();
  const f = n => (Number(n) || 0).toLocaleString('zh-CN');
  const { rows, total, reason } = stage.ready;
  const pop = document.createElement('div');
  pop.id = 'dr-ready-pop'; pop.className = 'dr-ready-pop';
  pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-labelledby', 'dr-ready-title');
  pop.innerHTML = `<div class="hd"><h3 id="dr-ready-title">${i + 1}. ${esc(stage.n)}</h3><button type="button" class="close" aria-label="关闭可做尺码明细">×</button></div>
    <div class="total"><span>本工序现在可做</span><span>${reason ? '待核对' : `<b class="num">${f(total)}</b> 件`}</span></div>
    ${reason ? `<div class="note">${esc(reason)}</div>` : rows.length ? `<div>${rows.map(r => `<div class="size"><span>${esc([r.c, r.s].filter(Boolean).join(' '))}</span><b class="num">${f(r.q)} 件</b></div>`).join('')}</div>` : '<div class="note">暂无可做尺码</div>'}`;
  document.body.appendChild(pop);
  card.setAttribute('aria-expanded', 'true'); card.setAttribute('aria-controls', pop.id);
  DR_POP = { card, pop, pinned };
  pop.addEventListener('pointerenter', () => { clearTimeout(DR_HIDE_TIMER); DR_HIDE_TIMER = null; });
  pop.addEventListener('pointerleave', delayDrPopupClose);
  positionDrPopup();
}
function delayDrPopupClose(){
  clearTimeout(DR_HIDE_TIMER);
  DR_HIDE_TIMER = setTimeout(() => {
    if (DR_POP && !DR_POP.pinned && !DR_POP.card.matches(':hover') && !DR_POP.pop.matches(':hover') && !DR_POP.pop.contains(document.activeElement) && document.activeElement !== DR_POP.card) closeDrPopup();
  }, 180);
}
function render(){
  if (S.view !== 'wall' || S.wallMode !== 'orders') wallExpandedOrders.clear();
  const oldCard = DR_POP?.card, oldPop = DR_POP?.pop;
  const oldGroup = oldCard && DR_READY[Number(oldCard.dataset.drG)];
  const reopen = oldGroup && {
    label:oldGroup.g.label, stage:oldGroup.st[Number(oldCard.dataset.drI)]?.n,
    pinned:DR_POP.pinned, hovered:oldCard.matches(':hover') || oldPop.matches(':hover'),
    cardFocus:document.activeElement === oldCard, popFocus:oldPop.contains(document.activeElement)
  };
  closeDrPopup();
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, n]) => `<button class="tab" data-act="view" data-v="${k}" aria-current="${S.view === k}">${NAV_ICON[k] || ''}<span class="tl">${n}</span><span class="ts">${NAV_SHORT[k] || n}</span></button>`).join('');
  const loading = !S.offline && !(S.got.cfg && S.got.orders && S.got.tasks);
  const ae = document.activeElement, fid = ae && ae.id && $app.contains(ae) ? ae.id : null;
  let sel = null; try { if (fid) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
  let html = S.offline ? '<div class="banner">没有连接到看板数据。请在 claude.ai 上打开这个看板，录入的内容才能保存。</div>' : '';
  if (loading) html += '<div class="empty"><h3>正在载入车间数据…</h3></div>';
  else html += urgentPanel() + ({ wall:wallView, report:reportView, daily:dailyView, orders:ordersView, styles:stylesView, settings:settingsView })[S.view]();
  $app.innerHTML = html;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (sel && sel[0] != null) el.setSelectionRange(sel[0], sel[1]); else if (el.type === 'number') { const v = el.value; el.value = ''; el.value = v; } } catch (e) {} } }
  if (reopen && S.view === 'daily' && (S.drTab || 'prog') === 'prog') {
    const gi = DR_READY.findIndex(x => x.g.label === reopen.label);
    const si = gi < 0 ? -1 : DR_READY[gi].st.findIndex(x => x.n === reopen.stage);
    const card = gi < 0 || si < 0 ? null : $app.querySelector(`.dr-st[data-dr-g="${gi}"][data-dr-i="${si}"]`);
    if (card && (reopen.pinned || reopen.hovered || reopen.cardFocus || reopen.popFocus)) {
      showDrPopup(card, reopen.pinned);
      if (reopen.cardFocus || reopen.popFocus) {
        DR_SUPPRESS_FOCUS = true;
        (reopen.popFocus ? DR_POP.pop.querySelector('.close') : card).focus({ preventScroll:true });
        queueMicrotask(() => { DR_SUPPRESS_FOCUS = false; });
      } else if (!reopen.pinned) delayDrPopupClose();
    }
  }
}

/* ---------- 交互 ---------- */
document.addEventListener('input', e => {
  const t = e.target; if (!t.id) return;
  if (t.dataset.planField) {
    const key = t.dataset.planKey, row = planDraft(key, S.orders[key]).rows.find(r => r.id === t.dataset.planRow);
    if (row) { row[t.dataset.planField] = t.value; syncPlanTotal(key); }
    return;
  }
  if (S.view === 'settings' && S.cfgDraft) {
    const c = S.cfgDraft;
    if (t.id.startsWith('sp-')) { const p = c.processes.find(x => x.id === t.id.slice(3)); if (p) p.name = t.value; return; }
    if (t.id.startsWith('sw-')) { const w = c.workers.find(x => x.id === t.id.slice(3)); if (w) w.name = t.value; return; }
    if (t.id === 'sc-colors') { c.colorsText = t.value; return; }
    if (t.id === 'sh-batch') { c.flowBatch = t.value; return; }
    if (t.id === 'sh-rh') { c.rateHours = t.value; return; }
    if (t.id === 'sh-start' || t.id === 'sh-end') { c.workHours = { ...(c.workHours || {}), [t.id === 'sh-start' ? 'start' : 'end']:t.value }; return; }
    if (t.id.startsWith('rate-')) { const [, wid, pid] = t.id.split('-'); c.rates = c.rates || {}; c.rates[wid] = c.rates[wid] || {}; if (t.value === '') delete c.rates[wid][pid]; else c.rates[wid][pid] = Math.max(0, Number(t.value) || 0); return; }
    if (t.id === 'sc-sizes') { c.sizesText = t.value; return; }
    if (t.id.startsWith('sk-')) {
      const [, wid, pid] = t.id.split('-'); const w = c.workers.find(x => x.id === wid); if (!w) return;
      w.skills = (w.skills || []).filter(x => x !== pid); if (t.checked) w.skills.push(pid);
      w.skills.sort((a, b) => c.processes.findIndex(p => p.id === a) - c.processes.findIndex(p => p.id === b));
      return;
    }
  }
  if (S.view === 'styles' && S.styleDraft) {
    if (t.id === 'sty-name') { S.styleDraft.name = t.value; return; }
    if (t.id === 'sty-alias') { S.styleDraft.aliases = t.value.split(/[,，、;；]+/).map(x => x.trim()).filter(Boolean); return; }
    if (t.id.startsWith('sr-')) { const st = S.styleDraft.steps.find(x => x.id === t.id.slice(3)); if (st) st.rate = t.value; refreshStyleEst(); return; }
    if (t.id === 'sty-qty') { S.form[t.id] = t.value; refreshStyleEst(); return; }
  }
  S.form[t.id] = t.type === 'checkbox' ? t.checked : t.value;
  if (t.id === 'no-color' || t.id.startsWith('eo-color-')) {
    const key = t.id === 'no-color' ? 'new' : t.id.slice(9), label = document.getElementById('plan-color-name-' + key);
    if (label) label.textContent = t.value.trim() || '未分颜色';
  }
  if (t.id === 'no-kind' || t.id.startsWith('al-to-') || t.id === 'no-style' || t.id === 'no-qty') { render(); return; }
  if (t.id.startsWith('ug-') && S.urgentPlan) { S.urgentPlan = null; render(); return; }
  if (t.id.startsWith('ah-o-')) { delete S.form['ah-p-' + t.id.slice(5)]; render(); return; }
  const m = /^r([csq])-(.+)-(\d+)$/.exec(t.id);
  if (m) {
    const [, f, tid, j] = m;
    const L = (S.rl[tid] = draftLines(tid).map(l => ({ ...l })));
    if (L[j]) L[j][f] = t.value;
    const tot = document.getElementById('rt-' + tid); if (tot) tot.textContent = sum(L, l => parseInt(l.q, 10) || 0);
    const h = document.querySelector('.savebar .hint'), b = document.querySelector('[data-act="save-report"]');
    if (h) h.textContent = `有 ${Object.keys(S.rl).length} 个任务改了没保存`; if (b) b.disabled = S.busy;
  }
});

document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.adhoc')) S.ahOpen[d.dataset.w] = d.open; }, true);

const ACTS = {

      const inReport = x => x.workerId === wid && x.orderId === oid && stepOf(x) === sid && (x.status !== 'done' || entries[x.id] != null);
      tid = (allTasks().filter(inReport).sort((a, b) => (a.status === 'done') - (b.status === 'done') || a.seq - b.seq)[0] || {}).id;

/* 一键派工：每道还没派完的工序，从常做这道工序的人里挑手上剩余件数最少的，把剩下的数量都派给他 */
function planDispatch(o){
  const load = {}, last = {};
  workers().forEach(w => { const q = queue(w.id); load[w.id] = sum(q, t => Math.max(0, t.target - t.done)); last[w.id] = q.length ? q[q.length - 1].seq : Date.now(); });
  const st = stepsOf(o), plan = [], skipped = [];
  for (const s of st) {
    const rest = Math.max(0, o.qty - stepAssigned(o.id, s.id)); if (!rest) continue;
    const able = workers().filter(w => (w.skills || []).includes(s.p));
    if (!able.length) { skipped.push(nameIn(st, s.id)); continue; }
    able.sort((a, b) => load[a.id] - load[b.id] || queue(a.id).length - queue(b.id).length);
    const w = able[0];
    load[w.id] += rest; last[w.id] += 1024;
    plan.push({ sid:s.id, p:s.p, wid:w.id, qty:rest, seq:last[w.id], name:nameIn(st, s.id) });
  }
  return { plan, skipped };
}
async function runDispatch(o){
  const { plan, skipped } = planDispatch(o);
  const miss = skipped.length ? `；没有人常做「${skipped.join('、')}」，这几道请手动派工或到设置里给人勾上` : '';
  if (!plan.length) { toast(skipped.length ? '没派出去' + miss : '每道工序都已经派完了', !!skipped.length); return false; }
  const ok = await save(async db => {
    for (const x of plan) await db.collection('tasks').doc().set({ orderId:o.id, step:x.sid, process:x.p, workerId:x.wid, target:x.qty, done:0, status:'active', seq:x.seq, createdAt:Date.now() });
  }, '已一键派工：' + plan.map(x => `${x.name}→${wname(x.wid)}`).join('，') + miss);
  return ok;
}

async function reorderProc(el, d){
  const o = S.orders[el.dataset.id], sid = el.dataset.p; if (!o) return;
  const arr = [...stepsOf(o)], i = arr.findIndex(s => s.id === sid), j = i + d;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  await writeSteps(o, arr);
}
function writeSteps(o, steps, msg){
  steps = steps.map(s => ({ id:s.id, p:s.p, ...(s.gx ? { gx:s.gx } : {}) }));
  return save(db => db.doc('orders/' + o.id).update({ steps, processes:steps.map(s => s.p) }), msg || ('工序路线已调整：' + steps.map(s => nameIn(steps, s.id)).join(' → ')));
}
function mv(arr, id, d){ const i = arr.findIndex(x => x.id === id), j = i + d; if (i < 0 || j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

/* 移动任务：换顺序或换人 */
async function moveTask(tid, wid, index){
  const t = S.tasks[tid], w = worker(wid); if (!t || !w) return;
  const q = queue(wid).filter(x => x.id !== tid);
  index = Math.max(0, Math.min(index, q.length));
  const seq = seqAt(q, index);
  let msg;
  if (index === 0 && q.length) msg = `已插单：${w.name}先做「${taskLabel(t)}」，原来的「${taskLabel(q[0])}」排到第 2 个`;
  else msg = (t.workerId === wid ? '已调整顺序' : `已改派给${w.name}`) + `，排第 ${index + 1} 个`;
  if (t.workerId !== wid && !(w.skills || []).includes(t.process)) msg += `（${procName(t.process)}不是${w.name}常做的）`;
  await save(db => db.doc('tasks/' + tid).update({ workerId:wid, seq }), msg);
}

/* 任务墙拖动：鼠标按住就能拖；手机按住约半秒再拖（轻划仍是滚动页面） */
let PD = null, PDscroll = 0;
function pdTarget(x, y){
  const el = document.elementFromPoint(x, y);
  const col = el && el.closest('.col[data-worker]'); if (!col) return null;
  const cards = [...col.querySelectorAll('.tk[data-task]')].filter(c => c.dataset.task !== PD.tid);
  let index = cards.length, mark = null, after = false;
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) { index = i; mark = cards[i]; break; }
  }
  if (!mark && cards.length) { mark = cards[cards.length - 1]; after = true; }
  return { col, wid: col.dataset.worker, index, mark, after };
}
function pdStart(x, y){
  const r = PD.el.getBoundingClientRect();
  const g = PD.el.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('data-task');
  g.style.width = r.width + 'px';
  PD.dx = x - r.left; PD.dy = y - r.top;
  document.body.appendChild(g);
  PD.ghost = g; PD.started = true;
  PD.el.classList.add('dragging');
  document.body.classList.add('pdragging');
  pdMove(x, y);
}
function pdMove(x, y){
  PD.lx = x; PD.ly = y;
  PD.ghost.style.transform = `translate(${x - PD.dx}px,${y - PD.dy}px) rotate(1.5deg)`;
  clearMarks();
  const t = pdTarget(x, y); PD.target = t;
  if (!t) return;
  t.col.classList.add('drop');
  if (t.mark) t.mark.classList.add(t.after ? 'after' : 'before');
  PDscroll = y < 70 ? -12 : y > innerHeight - 70 ? 12 : 0;
}
function pdLoop(){
  if (!PD || !PD.started) return;
  if (PDscroll) { scrollBy(0, PDscroll); pdMove(PD.lx, PD.ly); }
  requestAnimationFrame(pdLoop);
}
function pdEnd(drop){
  if (!PD) return;
  clearTimeout(PD.timer);
  const p = PD; PD = null; PDscroll = 0;
  if (!p.started) return;
  p.ghost.remove(); clearMarks();
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.body.classList.remove('pdragging');
  S.justDragged = true; setTimeout(() => { S.justDragged = false; }, 50);
  if (drop && p.target) moveTask(p.tid, p.target.wid, p.target.index);
}
